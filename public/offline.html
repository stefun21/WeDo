<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111c">
  <title>WeDo — Offline</title>
  <style>
    *{box-sizing:border-box}body{min-height:100dvh;margin:0;padding:24px;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,rgba(110,242,176,.1),transparent 30%),#090d14;color:#f5f7fa;font-family:system-ui,-apple-system,sans-serif}.card{width:min(430px,100%);padding:38px;text-align:center;border:1px solid #263343;border-radius:22px;background:linear-gradient(145deg,#17212e,#111823);box-shadow:0 28px 80px rgba(0,0,0,.35)}.mark{width:58px;height:58px;margin:0 auto 22px;display:grid;place-items:center;border:2px solid #6ef2b0;border-radius:18px;color:#6ef2b0;font-size:30px;font-weight:900}h1{margin:0;font-size:29px;letter-spacing:-1px}p{margin:14px auto 25px;color:#94a3b8;line-height:1.6}button{height:46px;padding:0 20px;border:0;border-radius:11px;background:#6ef2b0;color:#07130e;font-weight:800;cursor:pointer}
  </style>
</head>
<body><main class="card"><div class="mark">✓</div><h1>You’re offline</h1><p>Reconnect to sync your shared space. Your previously loaded lists remain available inside the open app.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
